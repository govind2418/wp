<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Login — Leela Infra Solution</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/style.css" />
<style>
  body { background: var(--paper-soft); }
  .gate-wrap {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .gate-card {
    width: 100%;
    max-width: 360px;
  }
  .gate-brand { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 28px; }
  .gate-brand img.munim-logo { height: 22px; width: auto; opacity: 0.75; margin-bottom: 18px; }
  .gate-brand img.leela-logo { height: 52px; width: auto; }
  .gate-panel {
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg, 18px);
    box-shadow: var(--shadow-md, 0 8px 30px rgba(16,21,26,0.08));
    padding: 28px 24px 24px;
  }
  .gate-icon {
    width: 46px; height: 46px; border-radius: 50%;
    background: var(--accent-100); color: var(--accent-700);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 12px;
  }
  .gate-title { text-align: center; font-size: 15px; font-weight: 650; color: var(--ink); }
  .gate-subtitle { text-align: center; font-size: 12.5px; color: var(--ink-muted); margin-top: 2px; margin-bottom: 20px; }
  .gate-dots { display: flex; justify-content: center; gap: 12px; margin-bottom: 18px; }
  .gate-dot { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--border); transition: all 0.15s ease; }
  .gate-dot.filled { background: var(--accent); border-color: var(--accent); }
  .gate-error {
    display: none;
    text-align: center;
    font-size: 12.5px;
    color: var(--danger);
    background: var(--danger-soft);
    border-radius: 10px;
    padding: 8px 12px;
    margin-bottom: 14px;
  }
  .gate-error.show { display: block; }
  .gate-keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .gate-key {
    padding: 16px 0;
    font-size: 20px;
    font-weight: 600;
    color: var(--ink);
    background: var(--paper-soft);
    border: 1px solid var(--border-soft);
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.12s ease;
  }
  .gate-key:active { background: var(--accent-100); }
  .gate-key:disabled { opacity: 0.5; cursor: default; }
  .gate-key.gate-key-ghost { background: transparent; border: none; cursor: default; }
  .gate-footer-note { text-align: center; font-size: 11px; color: var(--ink-faint); margin-top: 18px; }
</style>
</head>
<body>

<div class="gate-wrap">
  <div class="gate-card">
    <div class="gate-brand">
      <img class="munim-logo" src="/munim-ji-logo.png" alt="Munim Ji" />
      <img class="leela-logo" src="/leela-logo.png" alt="Leela Infra Solution" />
    </div>

    <div class="gate-panel">
      <div class="gate-icon">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <div class="gate-title">Owner Login</div>
      <div class="gate-subtitle">Enter PIN to continue</div>

      <div class="gate-dots" id="gateDots">
        <span class="gate-dot"></span>
        <span class="gate-dot"></span>
        <span class="gate-dot"></span>
        <span class="gate-dot"></span>
      </div>

      <div class="gate-error" id="gateError"></div>

      <div class="gate-keypad" id="gateKeypad">
        <button class="gate-key" data-digit="1">1</button>
        <button class="gate-key" data-digit="2">2</button>
        <button class="gate-key" data-digit="3">3</button>
        <button class="gate-key" data-digit="4">4</button>
        <button class="gate-key" data-digit="5">5</button>
        <button class="gate-key" data-digit="6">6</button>
        <button class="gate-key" data-digit="7">7</button>
        <button class="gate-key" data-digit="8">8</button>
        <button class="gate-key" data-digit="9">9</button>
        <button class="gate-key gate-key-ghost" disabled></button>
        <button class="gate-key" data-digit="0">0</button>
        <button class="gate-key" id="gateBackspace" title="Delete">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin:0 auto;display:block"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg>
        </button>
      </div>
    </div>

    <div class="gate-footer-note">Munim Ji × Leela Infra Solution — secured access</div>
  </div>
</div>

<script>
  let pin = '';
  let busy = false;
  const dots = document.querySelectorAll('.gate-dot');
  const errorEl = document.getElementById('gateError');
  const keypad = document.getElementById('gateKeypad');

  function render() {
    dots.forEach((d, i) => d.classList.toggle('filled', i < pin.length));
  }

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.classList.add('show');
  }
  function clearError() {
    errorEl.classList.remove('show');
  }

  function setBusy(v) {
    busy = v;
    keypad.querySelectorAll('button[data-digit]').forEach((b) => { b.disabled = v; });
  }

  async function submit() {
    setBusy(true);
    try {
      const res = await fetch('/api/gate/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pin }),
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok && data.ok) {
        window.location.href = '/';
        return;
      }
      showError(data.error || 'Wrong PIN');
      pin = '';
      render();
      setBusy(false);
    } catch {
      showError('Network error, try again');
      pin = '';
      render();
      setBusy(false);
    }
  }

  function press(digit) {
    if (busy || pin.length >= 4) return;
    clearError();
    pin += digit;
    render();
    if (pin.length === 4) submit();
  }

  function backspace() {
    if (busy) return;
    pin = pin.slice(0, -1);
    render();
  }

  keypad.querySelectorAll('button[data-digit]').forEach((btn) => {
    btn.addEventListener('click', () => press(btn.dataset.digit));
  });
  document.getElementById('gateBackspace').addEventListener('click', backspace);

  document.addEventListener('keydown', (e) => {
    if (e.key >= '0' && e.key <= '9') press(e.key);
    else if (e.key === 'Backspace') backspace();
  });
</script>

</body>
</html>
